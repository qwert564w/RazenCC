name: Build JAR

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: razencc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Normalize gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: ./gradlew build --no-daemon --stacktrace --refresh-dependencies

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryzen-jar
          path: build/libs/*.jar
          if-no-files-found: error
